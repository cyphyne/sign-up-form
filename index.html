<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loren | Sign up</title>
    <link rel="icon" type="image/png" href="images/loren-favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <!-- BACKGROUND -->
        <div class="child-div background">
            <div class="logo">
                <h2 class="banner-title">Loren</h2>
            </div>
            <img class="logo-img" src="images/loren-logo.png" alt="Loren logo">
            <h1 class="tagline"> Where innovation meets simplicity.</h1>
        </div>
        <!-- SIGN UP FORM -->
        <div class="child-div form-container">
            <h2>Create an account</h2>   
            <p class="subheading">Start your 30-day free trial</p>        
            <div class="form-card">
                <div class="input-container">
                    <div>
                        <label for="fname">First Name</label>
                        <input type="text" id="fname" name="fname" required>
                    </div>
                    <div>
                        <label for="lname">Last Name</label>
                        <input type="text" id="lname" name="lname" required>
                    </div>
                </div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
                <div class="input-container">
                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div>
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="password" required>
                    </div>
                </div>
            </div>
            <label class="terms-checkbox">
                <input type="checkbox" id="terms" name="terms_agreement" required>
                <label class="terms-agreement" for="terms">
                    I agree with the 
                    <a href="#">Terms and Conditions.</a>
                </label>
            </label>
            <button class="signup-btn">Sign up</button>
            <h4><span>or continue with</span></h4>
            <div class="signup-group">
                <button class="logo-btn">
                    <span class="icon icon-one"></span>
                </button>
                <button class="logo-btn">
                    <span class="icon icon-two"></span>
                </button>
                <button class="logo-btn">
                    <span class="icon icon-three"></span>
                </button>
            </div>
            <p class="sign-in">Already have an account?  <a href="#">Sign in</a> </p>
        </div>
    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
