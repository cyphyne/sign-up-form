<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loren | Sign up</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
</head>
<body>
    <main class="container">
        <!-- BACKGROUND -->
        <div class="child-div background">
            <h1 class="banner-title">Loren</h1>
        </div>
        <!-- SIGN UP FORM -->
        <div class="child-div form-container">
            <h2>Welcome to Loren</h2>           
            <div class="form-card">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" required>
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" required>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <label for="confirmPassword">Confirm Password</label>
                <input type="confirmPassword" id="confirmPassword" name="password" required>
            </div>
            <div class="terms-container">
                <input type="checkbox" id="terms" name="terms_agreement" required>
                <label for="terms">
                    I agree with the 
                    <a href="/terms-and-conditions" target="_blank">Terms and Conditions</a>.
                </label>
            </div>
            <button class="signup-btn">Sign up</button>
            <p>Already have an account? Sign in</p>
        </div>
    </main>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
